# Checks every push: formatting, vet, tests, and a build for every platform.
# It runs on Linux and on a Mac, so it catches anything that couldn't be
# checked while the code was being written.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build for Linux and macOS, Intel and Apple silicon
        run: |
          for os in linux darwin; do
            for arch in amd64 arm64; do
              echo "building $os/$arch"
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/coffee-and-toe-beans
            done
          done
