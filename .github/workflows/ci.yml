# Checks every push: formatting, vet and tests on Linux and on a Mac, then
# builds the game for macOS and Linux (Apple silicon, Intel, x86_64, arm64)
# and keeps the four programs as downloadable "artifacts" on the run's page,
# so a build can be tried without installing Go.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, name: macos-apple-silicon }
          - { goos: darwin, goarch: amd64, name: macos-intel }
          - { goos: linux,  goarch: amd64, name: linux-x86_64 }
          - { goos: linux,  goarch: arm64, name: linux-arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build for ${{ matrix.name }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p out
          go build -trimpath -ldflags "-s -w -X main.version=ci-${GITHUB_SHA::7}" \
            -o out/coffee-and-toe-beans ./cmd/coffee-and-toe-beans
          cp README.md LICENSE out/

      - name: Keep it as a download
        uses: actions/upload-artifact@v4
        with:
          name: coffee-and-toe-beans-${{ matrix.name }}
          path: out/
          retention-days: 30
